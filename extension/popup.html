<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PhishGuard AI</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <img src="icons/icon48.png" alt="Logo" class="logo">
      <div class="title-group">
        <h1>PhishGuard AI</h1>
        <span class="shield-badge">Real-Time Shield</span>
      </div>
    </div>
    <div class="active-pulse" title="System Active"></div>
  </div>
  
  <div class="status-card" id="status-card">
    <div class="card-header">
      <span class="label">CURRENT TARGET</span>
      <span class="protection-tag" id="protection-status">ACTIVE</span>
    </div>
    <div class="domain-display" id="current-url">Scanning...</div>

    <div class="metric-row">
      <div class="metric-pill">
        <span class="metric-label">STATUS</span>
        <span class="status-badge" id="status-text">ANALYZING</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">RISK SCORE</span>
        <span class="score-display" id="risk-score">--/100</span>
      </div>
    </div>

    <!-- DOM / Page Content Analysis Insight -->
    <div class="dom-section">
      <div class="dom-title">
        <span>🔍 DOM & Content Inspection</span>
        <span class="dom-tag" id="dom-status-tag">Inspecting</span>
      </div>
      <ul class="dom-findings-list" id="dom-findings">
        <li class="empty-state">No anomalies detected in form elements.</li>
      </ul>
    </div>
    
    <button id="scan-btn" class="action-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      Deep Scan Page
    </button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
